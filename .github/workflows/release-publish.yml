name: Release Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TAG="${BRANCH#release/}"
          VERSION="${TAG#v}"
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$PREV" ]; then
            PREV="v0.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (previous: ${PREV})"

      - name: Build release binary
        run: swift build -c release

      - name: Package artifacts
        run: make package

      - name: Create tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.version.outputs.previous_tag }}"
          NOTES_FLAG="--generate-notes"
          if [ "$PREV" != "v0.0.0" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag ${PREV}"
          fi
          gh release create "$TAG" \
            StatusBarKit.zip \
            --title "$TAG" \
            $NOTES_FLAG

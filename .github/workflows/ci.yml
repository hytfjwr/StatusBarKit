name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFTLINT_VERSION: '0.63.2'
  SWIFTFORMAT_VERSION: '0.60.1'

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          brew install mint
          mint install realm/SwiftLint@$SWIFTLINT_VERSION

      - name: Lint
        run: mint run swiftlint lint --strict

  format-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: |
          brew install mint
          mint install nicklockwood/SwiftFormat@$SWIFTFORMAT_VERSION

      - name: Check formatting
        run: mint run swiftformat --lint .

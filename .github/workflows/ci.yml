name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFTLINT_VERSION: '0.63.2'
  SWIFTFORMAT_VERSION: '0.60.1'

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          curl -sLo /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo cp /tmp/swiftlint/swiftlint /usr/local/bin/
          swiftlint version

      - name: Lint
        run: swiftlint lint --strict

  version-check:
    if: >-
      !(github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'release/')) &&
      !(github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No version tags found — skipping check"
            exit 0
          fi
          TAG_VERSION="${LATEST_TAG#v}"
          FILE_VERSION=$(sed -n 's/^public let statusBarKitVersion = "\(.*\)"/\1/p' \
            Sources/StatusBarKit/StatusBarKitVersion.swift)
          echo "Tag version:  ${TAG_VERSION}"
          echo "File version: ${FILE_VERSION}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: latest tag is v${TAG_VERSION} but StatusBarKitVersion.swift has ${FILE_VERSION}"
            exit 1
          fi
          echo "Versions match."

  format-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat
        run: |
          curl -sLo /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.artifactbundle.zip"
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat
          BINARY=$(find /tmp/swiftformat -name swiftformat -type f -perm +111 | grep macos | head -1)
          sudo cp "$BINARY" /usr/local/bin/swiftformat
          swiftformat --version

      - name: Check formatting
        run: swiftformat --lint .
